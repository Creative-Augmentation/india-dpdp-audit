<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pre-choice request fixture</title>
<script defer src="/assets/consent.js"></script>
<main data-consent-fixture="early">
  <h1>Pre-choice request fixture</h1>
  <p>Optional measurement should run only after acceptance.</p>
  <button type="button" data-choice="granted">Accept optional measurement</button>
  <button type="button" data-choice="denied">Reject optional measurement</button>
  <button type="button" data-choice="denied">Withdraw permission</button>
  <button type="button" data-choice="reset">Reset this fixture</button>
  <p>Current choice: <output aria-live="polite" id="choice"></output></p>
  <a href="/">Fixture index</a>
</main>
</html>
