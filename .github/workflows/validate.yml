name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-11-18
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, checked 2026-11-18
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            skills/india-dpdp-audit/scripts/requirements.txt
            tests/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r skills/india-dpdp-audit/scripts/requirements.txt -r tests/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Check public fixture hygiene
        run: python scripts/check_fixture_hygiene.py
