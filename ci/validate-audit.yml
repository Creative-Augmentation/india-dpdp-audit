name: Validate audit package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-11-18
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, checked 2026-11-18
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install -r skills/india-dpdp-audit/scripts/requirements.txt -r tests/requirements.txt
      - name: Test schema, evidence boundaries and CLI
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic benchmark definitions
        run: python benchmark/runner.py
      - name: Check public fixture hygiene
        run: python scripts/check_fixture_hygiene.py
      - name: Validate and render the synthetic example
        run: |
          python skills/india-dpdp-audit/scripts/audit.py validate skills/india-dpdp-audit/assets/example-audit.json
          python skills/india-dpdp-audit/scripts/audit.py render skills/india-dpdp-audit/assets/example-audit.json > /tmp/example-audit.md
